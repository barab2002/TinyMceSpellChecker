<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hebrew Spell-Check — TinyMCE v7 Demo</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, Arial, sans-serif;
      background: #f3f4f6;
      padding: 24px;
      direction: rtl;
      color: #111827;
    }
    .page-header { margin-bottom: 20px; }
    .page-header h1 { font-size: 22px; font-weight: 700; color: #111827; }
    .page-header p  { color: #6b7280; font-size: 14px; margin-top: 4px; }

    /* Config bar */
    .config-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }
    .config-bar label { font-size: 13px; color: #374151; }
    .config-bar input {
      padding: 5px 10px;
      border: 1px solid #d1d5db;
      border-radius: 5px;
      font-size: 13px;
      width: 230px;
      direction: ltr;
    }
    .config-bar input:focus { outline: 2px solid #3b82f6; border-color: transparent; }

    /* Status badge */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 20px;
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      cursor: pointer;
      user-select: none;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #9ca3af; flex-shrink: 0; }
    .dot.ok  { background: #16a34a; }
    .dot.err { background: #dc2626; }
    .dot.spin { animation: spin 1s linear infinite; background: #3b82f6; }
    @keyframes spin {
      0%,100%{ opacity:1 } 50%{ opacity:.3 }
    }

    /* Info box */
    .info-box {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 6px;
      padding: 10px 14px;
      font-size: 13px;
      color: #1d4ed8;
      margin-bottom: 16px;
      max-width: 900px;
    }
    .info-box code {
      background: #dbeafe;
      padding: 1px 4px;
      border-radius: 3px;
      font-family: monospace;
      font-size: 12px;
    }

    #editor-wrap { max-width: 900px; }
  </style>
</head>
<body>

<div class="page-header">
  <h1>בדיקת איות עברית — TinyMCE v7</h1>
  <p>הדגמה של פלאגין בדיקת האיות הפנימי. לחץ על <strong>"בדיקת איות"</strong> בסרגל הכלים.</p>
</div>

<!-- Backend URL config — change this if your API is on a different host/port -->
<div class="config-bar">
  <label for="api-url-input">כתובת שרת בדיקת האיות:</label>
  <input id="api-url-input" type="text" value="http://localhost:8000" dir="ltr" />
  <div class="status-badge" id="status-badge" onclick="checkHealth()" title="לחץ לרענון">
    <span class="dot spin" id="status-dot"></span>
    <span id="status-text">בודק חיבור...</span>
  </div>
  <a href="http://localhost:8000/docs" target="_blank"
     style="font-size:12px;color:#2563eb;text-decoration:none;">📖 Swagger UI</a>
</div>

<div class="info-box">
  ℹ️ הטקסט לדוגמה מכיל שגיאות כתיב מכוונות:
  <code>שלומ</code> (במקום שלום),
  <code>מכווונות</code>,
  <code>אורחנוזציה</code>.
  מילות הארגון כמו <code>Salesforce</code>, <code>ZoomInfo</code> — לא יסומנו.
</div>

<div id="editor-wrap">
  <textarea id="editor">שלומ לכולם,

אני כותב מסמך בדיקה עבור מערכת בדיקת האיות הפנימית של הארגון שלנו.
המסמך הזה מכיל מספר שגיאות כתיבה מכווונות כדי לבדוק את תפקוד המערכת.

כחלק מהאורחנוזציה שלנו אנחנו משתמשים בכלים כמו Salesforce, ZoomInfo ו-Snowflake.
חשוב לוודא שהמילים הללו מוכרות למערכת ואינן מסומנות כשגיאות.

המחלקה שלנו עוסקת בניהול מכירות, שיווק ופיתוח עסקי.
אנחנו מאמינים שכלים טכנולוגיים מתקדמים עוזרים לנו להצליח.

בברכה,
הצוות</textarea>
</div>

<!--
  TinyMCE v7:
    Self-hosted (recommended for internal use):
      <script src="/tinymce/tinymce.min.js"></script>
    Or CDN for quick demo:
-->
<script src="https://cdn.jsdelivr.net/npm/tinymce@7/tinymce.min.js"
        referrerpolicy="origin"></script>

<!-- Hebrew Spell-Check Plugin — served by nginx static-server or your web server -->
<script src="/plugin/hebrewspellcheck/plugin.js"></script>

<script>
  // ─── Resolve API URL from the config input ───────────────────────────────
  function getApiUrl() {
    return (document.getElementById('api-url-input').value || 'http://localhost:8000')
      .trim().replace(/\/$/, '');
  }

  // ─── Health check ────────────────────────────────────────────────────────
  async function checkHealth() {
    const dot  = document.getElementById('status-dot');
    const text = document.getElementById('status-text');
    dot.className  = 'dot spin';
    text.textContent = 'בודק...';

    try {
      const res = await fetch(getApiUrl() + '/health', {
        signal: AbortSignal.timeout(5000),
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();

      dot.className = 'dot ok';
      const engine  = data.hunspell_available ? '✓' : '✗';
      text.textContent =
        `שרת פעיל | מנוע: ${engine} | מילים מותאמות: ${data.custom_dict_words}`;

      // Update the Swagger link to use the current API URL
      document.querySelector('a[href*="/docs"]').href = getApiUrl() + '/docs';
    } catch (e) {
      dot.className = 'dot err';
      text.textContent = 'שרת לא זמין — הפעל את הבאקנד';
    }
  }

  // Re-check when URL changes
  document.getElementById('api-url-input').addEventListener('change', () => {
    // Re-init TinyMCE plugin with new URL
    const ed = tinymce.get('editor');
    if (ed) {
      ed.options.set('hebrewspellcheck_api_url', getApiUrl());
    }
    checkHealth();
  });

  // ─── TinyMCE init ────────────────────────────────────────────────────────
  tinymce.init({
    selector: '#editor',

    // ── External plugin (single file, no build step) ──
    external_plugins: {
      hebrewspellcheck: '/plugin/hebrewspellcheck/plugin.js',
    },

    // ── Built-in plugins ──
    plugins: ['lists', 'link', 'table', 'code'],

    // ── Toolbar: spell-check buttons first, then standard editing tools ──
    toolbar: [
      'hebrewspellcheck hebrewspellcheck_clear | ' +
      'undo redo | blocks | ' +
      'bold italic underline | ' +
      'alignright aligncenter alignleft | ' +
      'bullist numlist | link | code',
    ],

    // ── Menu ──
    menu: {
      tools: {
        title: 'כלים',
        items: 'hebrewspellcheck hebrewspellcheck_clear',
      },
    },

    // ── Spell-check plugin options ──
    hebrewspellcheck_api_url:         getApiUrl(),
    hebrewspellcheck_language:        'he-IL',
    hebrewspellcheck_max_suggestions: 5,

    // ── Allow spell-check spans through TinyMCE's content sanitiser ──
    extended_valid_elements: 'span[class|data-word|data-suggestions]',

    // ── Disable browser spell-check (we do it ourselves) ──
    browser_spellcheck: false,
    gecko_spellcheck:   false,

    // ── RTL / Hebrew layout ──
    directionality: 'rtl',

    // ── Editor appearance ──
    height: 500,
    resize: true,
    content_style: `
      body {
        font-family: Arial, "David CLM", "Frank Ruehl CLM", sans-serif;
        font-size: 15px;
        line-height: 1.75;
        direction: rtl;
        text-align: right;
        color: #111827;
        padding: 20px 24px;
        max-width: 820px;
        margin: 0 auto;
      }
    `,

    // ── Suppress TinyMCE branding in toolbar (optional) ──
    branding: false,

    // ── Run health check once editor is ready ──
    setup: (editor) => {
      editor.on('init', () => {
        checkHealth();
      });
    },
  });
</script>

</body>
</html>
