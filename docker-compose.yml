version: '3.9'

services:
  spellcheck-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hebrew-spellcheck-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      # All SPELLCHECK_* vars override defaults from .env inside the container
      - SPELLCHECK_HOST=0.0.0.0
      - SPELLCHECK_PORT=8000
      - SPELLCHECK_LOG_LEVEL=${LOG_LEVEL:-INFO}
      - SPELLCHECK_CORS_ORIGINS=${CORS_ORIGINS:-*}
      - SPELLCHECK_HUNSPELL_DICT_DIR=/app/dictionaries
      - SPELLCHECK_CUSTOM_DICT_PATH=/app/dictionaries/custom/org_dictionary.json
      - SPELLCHECK_DEFAULT_LANGUAGE=he_IL
      - SPELLCHECK_MAX_TEXT_LENGTH=200000
      - SPELLCHECK_MAX_SUGGESTIONS=5
    volumes:
      # Persist the custom dictionary across container restarts
      - ./backend/dictionaries/custom:/app/dictionaries/custom
      # Persist logs (optional)
      - ./backend/logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Optional: static file server to serve the TinyMCE plugin and example page
  # Remove this service if you serve the plugin via your own web server.
  static-server:
    image: nginx:alpine
    container_name: hebrew-spellcheck-static
    restart: unless-stopped
    ports:
      - "${STATIC_PORT:-3000}:80"
    volumes:
      - ./plugin:/usr/share/nginx/html/plugin:ro
      - ./example:/usr/share/nginx/html/example:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - spellcheck-api
