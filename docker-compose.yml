version: '3.9'

services:
  redis:
    image: redis:7-alpine
    container_name: hebrew-spellcheck-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --save "" --appendonly no --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  spellcheck-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hebrew-spellcheck-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      - SPELLCHECK_HOST=0.0.0.0
      - SPELLCHECK_PORT=8000
      - SPELLCHECK_LOG_LEVEL=${LOG_LEVEL:-INFO}
      - SPELLCHECK_CORS_ORIGINS=${CORS_ORIGINS:-*}
      - SPELLCHECK_HUNSPELL_DICT_DIR=/app/dictionaries
      - SPELLCHECK_CUSTOM_DICT_PATH=/app/dictionaries/custom/org_dictionary.json
      - SPELLCHECK_DEFAULT_LANGUAGE=he_IL
      - SPELLCHECK_MAX_TEXT_LENGTH=200000
      - SPELLCHECK_MAX_SUGGESTIONS=5
      - SPELLCHECK_REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      # Persist the custom dictionary across container restarts
      - ./backend/dictionaries/custom:/app/dictionaries/custom
      - ./backend/logs:/app/logs
    healthcheck:
      # Use Python (already in the image) instead of curl
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Serves the TinyMCE plugin and demo page.
  # Remove this service if you serve static files via your own web server.
  static-server:
    image: nginx:alpine
    container_name: hebrew-spellcheck-static
    restart: unless-stopped
    ports:
      - "${STATIC_PORT:-3000}:80"
    volumes:
      - ./plugin:/usr/share/nginx/html/plugin:ro
      - ./example:/usr/share/nginx/html/example:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      spellcheck-api:
        condition: service_healthy
